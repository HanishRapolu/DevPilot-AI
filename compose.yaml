services:
  sandbox:
    profiles: ["tools"]
    build: ./sandbox
    image: devpilot-python-tests:phase2
    # Build only. Testing MCP supplies every isolation flag when running it.
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongo_data:
